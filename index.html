<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BrickSeek UPC Lookup</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    margin:40px;
}

textarea{
    width:500px;
    height:250px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    cursor:pointer;
}

#results{
    margin-top:25px;
    white-space:pre-wrap;
    font-family:Consolas, monospace;
    border:1px solid #ccc;
    padding:15px;
    width:800px;
    min-height:200px;
}
</style>

</head>
<body>

<h2>BrickSeek UPC Lookup</h2>

<p>Enter one UPC per line.</p>

<textarea id="upcs"></textarea>
<br>
<button onclick="lookup()">Lookup</button>

<div id="results"></div>

<script>

async function lookup() {

    const results = document.getElementById("results");
    results.innerHTML = "Searching...<br>";

    const upcs = document.getElementById("upcs")
        .value
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x.length);

    results.innerHTML = "";

    for (const upc of upcs) {

        const apiUrl = `https://api.brickseek.com/products/inventory-checker?search=${encodeURIComponent(upc)}&retailer_id=3`;

        const row = document.createElement("div");

        const link = document.createElement("a");
        link.href = `https://brickseek.com/walmart-inventory-checker/?sku=${upc}`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = upc;

        row.appendChild(link);

        // Create a 1-second timeout
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 100);

        try {

            const response = await fetch(apiUrl, {
                signal: controller.signal
            });

            clearTimeout(timeout);

            const data = await response.json();

            if (data.matchedProduct) {
                row.append(` - ${data.matchedProduct.name}`);
            } else {
                row.append(" - NONE");
            }

        } catch (err) {

            clearTimeout(timeout);

            if (err.name === "AbortError") {
                row.append(" - TIMEOUT (Skipped)");
            } else {
                row.append(` - ERROR (${err.message})`);
            }

        }

        results.appendChild(row);
    }
}

</script>

</body>
</html>
