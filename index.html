<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BrickSeek UPC Lookup</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    margin:40px;
}

textarea{
    width:500px;
    height:250px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    cursor:pointer;
}

#results{
    margin-top:25px;
    white-space:pre-wrap;
    font-family:Consolas, monospace;
    border:1px solid #ccc;
    padding:15px;
    width:800px;
    min-height:200px;
}
</style>

</head>
<body>

<h2>BrickSeek UPC Lookup</h2>

<p>Enter one UPC per line.</p>

<textarea id="upcs"></textarea>
<br>
<button onclick="lookup()">Lookup</button>

<div id="results"></div>

<script>

async function lookup() {

    const results = document.getElementById("results");
    results.textContent = "Searching...\n";

    const upcs = document.getElementById("upcs")
        .value
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(x => x.length);

    results.textContent = "";

    for (const upc of upcs) {

        const url = `https://api.brickseek.com/products/inventory-checker?search=${encodeURIComponent(upc)}&retailer_id=3`;

        try {

            const response = await fetch(url);

            const data = await response.json();

            if (data.matchedProduct) {
                results.textContent += `${upc} - ${data.matchedProduct.name}\n`;
            } else {
                results.textContent += `${upc} - NONE\n`;
            }

        } catch (err) {
            results.textContent += `${upc} - ERROR (${err.message})\n`;
        }

    }

}

</script>

</body>
</html>
